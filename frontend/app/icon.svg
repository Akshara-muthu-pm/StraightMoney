<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient (PayPal Deep Enterprise Navy) -->
    <linearGradient id="sm-badge-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001C64" />
      <stop offset="45%" stop-color="#001435" />
      <stop offset="100%" stop-color="#000A1C" />
    </linearGradient>

    <!-- Upper Stream Gradient (PayPal Navy into Vibrant Blue) -->
    <linearGradient id="sm-navy-grad" x1="8" y1="7" x2="24" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052B4" />
      <stop offset="100%" stop-color="#001C64" />
    </linearGradient>

    <!-- Lower Stream Gradient (PayPal Active Sky into Electric Cyan) -->
    <linearGradient id="sm-cyan-grad" x1="10" y1="15" x2="26" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0070BA" />
    </linearGradient>

    <!-- Straight Vector Beam (PayPal Gold Gradient) -->
    <linearGradient id="sm-gold-grad" x1="6" y1="16" x2="25" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="60%" stop-color="#FFC439" />
      <stop offset="100%" stop-color="#FF9E1B" />
    </linearGradient>

    <!-- Subtle Premium Glow -->
    <filter id="sm-tile-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.8" flood-color="#0070BA" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- App Tile Background (Squircle) -->
  <rect width="32" height="32" rx="8" fill="url(#sm-badge-grad)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="white" stroke-opacity="0.12" stroke-width="0.75" />

  <!-- Centered & Slanted Brand Glyph -->
  <g transform="translate(16, 16) skewX(-7.5) translate(-13.6, -16)" filter="url(#sm-tile-glow)">
    <!-- 1. Upper Stream: Donor Direct Giving Flow -->
    <path d="M19.5 7.5H10.5C7.5 7.5 5 9.8 5 12.8C5 15.6 7.2 17.5 10.2 17.5H17"
          stroke="url(#sm-navy-grad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 2. Lower Stream: Direct Vendor Payout Flow -->
    <path d="M6.5 24.5H15.5C18.5 24.5 21 22.2 21 19.2C21 16.4 18.8 14.5 15.8 14.5H9"
          stroke="url(#sm-cyan-grad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 3. Overlap Blend (PayPal Multi-tone Translucency) -->
    <path d="M10.2 17.5H15.8" stroke="#00457C" stroke-width="3.2" stroke-linecap="round" opacity="0.95" />

    <!-- 4. The Straight Vector: Direct Horizontal Payout Arrow -->
    <path d="M3.5 16H22M22 16L17.5 11.5M22 16L17.5 20.5"
          stroke="url(#sm-gold-grad)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 5. Golden Verified Payout Node (Spark of Trust) -->
    <circle cx="22" cy="16" r="1.8" fill="#FFFFFF" />
    <circle cx="22" cy="16" r="1.0" fill="#FFC439" />
  </g>
</svg>